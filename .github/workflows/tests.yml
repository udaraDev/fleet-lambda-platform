name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet

  clean-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned application images from a clean checkout
        run: docker compose build api airflow-scheduler
      - name: Verify the complete stack with fresh volumes
        env:
          CLEAN_INSTALL_SCOPE: clean GitHub-hosted Ubuntu runner; fresh checkout, images and volumes
        run: python -m scripts.verify_clean_install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-evidence
          path: output/evidence/clean-install.json
