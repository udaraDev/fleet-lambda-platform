name: fleet-lambda

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATA_DIR: /data
  SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
  EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-2}
  VEHICLE_COUNT: ${VEHICLE_COUNT:-12}
  NO_DATA_SECONDS: ${NO_DATA_SECONDS:-120}
  RAW_ARCHIVE_LAG_MINUTES: ${RAW_ARCHIVE_LAG_MINUTES:-60}
  DQ_FAILURE_THRESHOLD: ${DQ_FAILURE_THRESHOLD:-0.05}
  MAX_CHANGED_DATES_PER_RUN: ${MAX_CHANGED_DATES_PER_RUN:-5}
  PROMETHEUS_URL: http://prometheus:9090
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?run python -m scripts.bootstrap_env}
  MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?run python -m scripts.bootstrap_env}

x-app: &app
  image: fleet-platform:dev
  build: .
  environment: *app-env
  volumes:
    - fleet-data:/data
  restart: unless-stopped

x-airflow: &airflow
  image: fleet-airflow:dev
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
    additional_contexts:
      platform: service:api
  environment: &airflow-env
    <<: *app-env
    DATABASE_URL: postgresql://fleet_batch:${FLEET_BATCH_PASSWORD:?generate .env}@postgres:5432/fleet
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:${AIRFLOW_DB_PASSWORD:?generate .env}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?generate .env}
  volumes:
    - fleet-data:/data
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate .env}
      POSTGRES_DB: fleet
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fleet -d fleet']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-security-init:
    image: fleet-platform:dev
    build: .
    restart: 'no'
    environment:
      DATABASE_ADMIN_URL: postgresql://fleet:${POSTGRES_PASSWORD:?generate .env}@postgres:5432/fleet
      FLEET_API_PASSWORD: ${FLEET_API_PASSWORD:?generate .env}
      FLEET_STREAM_PASSWORD: ${FLEET_STREAM_PASSWORD:?generate .env}
      FLEET_BATCH_PASSWORD: ${FLEET_BATCH_PASSWORD:?generate .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?generate .env}
    command: [python, -m, scripts.init_security]
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trip-events \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trip-events-dead-letter \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=604800000
        echo "Topics created."

  data-init:
    image: python:3.11-slim-bookworm
    user: '0:0'
    volumes:
      - fleet-data:/data
    command: [python, -c, "import os; os.chown('/data',50000,0); os.chmod('/data',0o770)"]

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?generate .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generate .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-mc:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?generate .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generate .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?generate .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?generate .env}
    volumes:
      - ./docker/minio-app-policy.json:/config/minio-app-policy.json:ro
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb local/fleet-raw --ignore-existing;
      /usr/bin/mc admin user add local $$MINIO_APP_ACCESS_KEY $$MINIO_APP_SECRET_KEY;
      /usr/bin/mc admin policy create local fleet-app /config/minio-app-policy.json;
      /usr/bin/mc admin policy attach local fleet-app --user $$MINIO_APP_ACCESS_KEY;
      "

  streaming-raw:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_stream:${FLEET_STREAM_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [spark-submit, --master, 'local[2]', --driver-memory, 1g, streaming/raw_job.py]
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
      minio-mc:
        condition: service_completed_successfully

  streaming-speed:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_stream:${FLEET_STREAM_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [spark-submit, --master, 'local[2]', --driver-memory, 1g, streaming/speed_job.py]
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  producer-stream:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_stream:${FLEET_STREAM_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [python, -m, simulators.producer_stream]
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  producer-batch:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_batch:${FLEET_BATCH_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [python, -m, simulators.producer_batch]
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  api:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_api:${FLEET_API_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [uvicorn, api.main:app, --host, 0.0.0.0, --port, '8000']
    ports:
      - '127.0.0.1:${API_PORT:-8001}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    restart: 'no'
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?generate .env}
    command: version
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - '127.0.0.1:${AIRFLOW_PORT:-8080}:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.51.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?generate .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

  tools:
    <<: *app
    profiles: [tools]
    restart: 'no'
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet_batch:${FLEET_BATCH_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [python, -c, "print('Use docker compose run --rm tools <command>')"]
    depends_on:
      postgres:
        condition: service_healthy
      db-security-init:
        condition: service_completed_successfully
      minio-mc:
        condition: service_completed_successfully

  migration:
    <<: *app
    profiles: [tools]
    restart: 'no'
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD:?generate .env}@postgres:5432/fleet
    command: [python, -m, scripts.migrate_integrity]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fleet-data:
  postgres-data:
  kafka-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
  minio-data:
