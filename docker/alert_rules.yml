groups:
  - name: fleet_alerts
    rules:
      - alert: FleetPipelineUnhealthy
        expr: fleet_pipeline_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fleet pipeline is unhealthy"
          description: "Accepted telemetry is stale or the immutable raw archive is behind live serving."

      - alert: FleetHighRejectionRate
        expr: fleet_events_rejected_total / (fleet_events_ingested_total + 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High event rejection rate"
          description: "More than 5% of events are being rejected. Check stream_conflicts table."

      - alert: FleetLastEventStale
        expr: fleet_last_event_age_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Last telemetry event is stale"
          description: "The most recent event is more than 120 seconds old."

      - alert: FleetRawArchiveLag
        expr: fleet_raw_archive_lag_seconds > 3600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Raw archive is behind live serving"
          description: "The immutable raw layer trails live event time by more than 60 simulated minutes."
