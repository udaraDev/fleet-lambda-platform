<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <style>
      .bg { fill:#FFFFFF; }
      .layer-speed { fill:#FFFFFF; stroke:#1F6FEB; stroke-width:3; stroke-dasharray:10 7; rx:18; }
      .layer-batch { fill:#FFFFFF; stroke:#D29922; stroke-width:3; stroke-dasharray:10 7; rx:18; }
      .layer-serve { fill:#FFFFFF; stroke:#3FB950; stroke-width:3; stroke-dasharray:10 7; rx:18; }
      .node { fill:#161B22; stroke-width:3; rx:14; }
      .kafka { stroke:#F4845F; }
      .spark { stroke:#3FB950; }
      .pg { fill:#1A1B3A; stroke:#58A6FF; }
      .file { fill:#2D1A00; stroke:#D29922; }
      .airflow { fill:#161B22; stroke:#6E7681; }
      .title { font-family:Arial,Helvetica,sans-serif; font-size:34px; font-weight:700; }
      .t-speed { fill:#58A6FF; }
      .t-batch { fill:#E3B341; }
      .t-serve { fill:#56D364; }
      .h { font-family:Arial,Helvetica,sans-serif; font-size:22px; font-weight:700; fill:#F0F6FC; }
      .s { font-family:Arial,Helvetica,sans-serif; font-size:17px; fill:#C9D1D9; }
      .si { font-family:Arial,Helvetica,sans-serif; font-size:16px; font-style:italic; fill:#8B949E; }
      .arrow { stroke:#263746; stroke-width:4; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#263746; stroke-width:4; fill:none; }
      .cross { stroke:#263746; stroke-width:3.5; stroke-dasharray:11 7; fill:none; marker-end:url(#arrow); }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:700; fill:#263746; paint-order:stroke fill; stroke:#FFFFFF; stroke-width:7px; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263746"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="920"/>

  <!-- SPEED LAYER -->
  <rect class="layer-speed" x="20" y="20" width="1760" height="250" rx="20"/>
  <text class="title t-speed" x="45" y="65">SPEED LAYER</text>

  <rect class="node kafka" x="45" y="95" width="245" height="120" rx="14"/>
  <text class="h" x="167" y="133" text-anchor="middle">Telemetry Producer</text>
  <text class="s" x="167" y="165" text-anchor="middle">producer_stream.py</text>

  <rect class="node kafka" x="340" y="82" width="310" height="145" rx="14"/>
  <text class="h" x="495" y="118" text-anchor="middle">Kafka (KRaft)</text>
  <text class="s" x="495" y="148" text-anchor="middle">trip-events (3 parts)</text>
  <text class="s" x="495" y="175" text-anchor="middle">key=vehicle_id</text>
  <text class="si" x="495" y="202" text-anchor="middle">+ dead-letter topic</text>

  <rect class="node spark" x="700" y="62" width="300" height="82" rx="14"/>
  <text class="h" x="850" y="96" text-anchor="middle">Spark Speed Stream</text>
  <text class="s" x="850" y="124" text-anchor="middle">speed_job.py</text>

  <rect class="node spark" x="700" y="168" width="300" height="82" rx="14"/>
  <text class="h" x="850" y="202" text-anchor="middle">Spark Raw Stream</text>
  <text class="s" x="850" y="230" text-anchor="middle">raw_job.py</text>

  <rect class="node pg" x="1050" y="52" width="320" height="132" rx="14"/>
  <text class="h" x="1210" y="84" text-anchor="middle">PostgreSQL (Speed)</text>
  <text class="s" x="1210" y="109" text-anchor="middle">rt_vehicle_state</text>
  <text class="s" x="1210" y="132" text-anchor="middle">completed_trips</text>
  <text class="s" x="1210" y="155" text-anchor="middle">rt_zone_metrics</text>
  <text class="s" x="1210" y="178" text-anchor="middle">rt_alerts</text>

  <rect class="node file" x="1420" y="160" width="315" height="92" rx="14"/>
  <text class="h" x="1577" y="190" text-anchor="middle">MinIO Parquet Archive</text>
  <text class="s" x="1577" y="217" text-anchor="middle">s3a://fleet-raw/dt=DATE/</text>
  <text class="s" x="1577" y="241" text-anchor="middle">SHA-256 manifest</text>

  <path class="arrow" d="M290 155 H340"/>
  <path class="branch" d="M650 155 H675 V103"/>
  <path class="branch" d="M675 155 V209"/>
  <path class="arrow" d="M675 103 H700"/>
  <path class="arrow" d="M675 209 H700"/>
  <path class="arrow" d="M1000 103 H1050"/>
  <path class="arrow" d="M1000 209 H1420"/>

  <!-- BATCH LAYER -->
  <rect class="layer-batch" x="20" y="305" width="1760" height="250" rx="20"/>
  <text class="title t-batch" x="45" y="350">BATCH LAYER</text>

  <rect class="node file" x="45" y="385" width="250" height="115" rx="14"/>
  <text class="h" x="170" y="422" text-anchor="middle">Expense Producer</text>
  <text class="s" x="170" y="455" text-anchor="middle">producer_batch.py</text>

  <rect class="node file" x="345" y="385" width="270" height="115" rx="14"/>
  <text class="h" x="480" y="422" text-anchor="middle">CSV Landing Zone</text>
  <text class="s" x="480" y="455" text-anchor="middle">expenses_DATE.csv</text>

  <rect class="node airflow" x="665" y="365" width="360" height="155" rx="14"/>
  <text class="h" x="845" y="404" text-anchor="middle">Airflow DAG (1 orchestration task)</text>
  <text class="s" x="845" y="437" text-anchor="middle">Discover, validate and reconcile</text>
  <text class="s" x="845" y="466" text-anchor="middle">Publish reports and metrics</text>

  <rect class="node spark" x="1070" y="385" width="300" height="115" rx="14"/>
  <text class="h" x="1220" y="422" text-anchor="middle">Spark Batch Reconcile</text>
  <text class="s" x="1220" y="455" text-anchor="middle">spark_reconcile.py</text>

  <rect class="node pg" x="1415" y="365" width="320" height="155" rx="14"/>
  <text class="h" x="1575" y="402" text-anchor="middle">PostgreSQL (Batch)</text>
  <text class="s" x="1575" y="434" text-anchor="middle">daily_vehicle_profit</text>
  <text class="s" x="1575" y="463" text-anchor="middle">daily_zone_summary</text>
  <text class="s" x="1575" y="492" text-anchor="middle">Reports: JSON/CSV/HTML/Parquet</text>

  <path class="arrow" d="M295 442 H345"/>
  <path class="arrow" d="M615 442 H665"/>
  <path class="arrow" d="M1025 442 H1070"/>
  <path class="arrow" d="M1370 442 H1415"/>

  <!-- SERVING LAYER -->
  <rect class="layer-serve" x="20" y="590" width="1760" height="300" rx="20"/>
  <text class="title t-serve" x="45" y="635">SERVING LAYER</text>

  <rect class="node spark" x="700" y="690" width="300" height="135" rx="14"/>
  <text class="h" x="850" y="730" text-anchor="middle">FastAPI</text>
  <text class="s" x="850" y="765" text-anchor="middle">GET /metrics/fleet</text>
  <text class="s" x="850" y="795" text-anchor="middle">GET /reports/daily...</text>

  <rect class="node kafka" x="1110" y="655" width="300" height="95" rx="14"/>
  <text class="h" x="1260" y="692" text-anchor="middle">Dashboard</text>
  <text class="s" x="1260" y="722" text-anchor="middle">Business HTML view</text>

  <rect class="node kafka" x="1110" y="770" width="300" height="95" rx="14"/>
  <text class="h" x="1260" y="807" text-anchor="middle">Prometheus</text>
  <text class="s" x="1260" y="837" text-anchor="middle">Scrapes /metrics</text>

  <rect class="node kafka" x="1480" y="770" width="255" height="95" rx="14"/>
  <text class="h" x="1607" y="807" text-anchor="middle">Grafana</text>
  <text class="s" x="1607" y="837" text-anchor="middle">Dashboards &amp; Alerts</text>

  <path class="arrow" d="M1000 725 H1110"/>
  <path class="arrow" d="M1000 790 H1110"/>
  <path class="arrow" d="M1410 817 H1480"/>

  <!-- CROSS-LAYER CONNECTIONS -->
  <!-- MinIO is the batch source: the arrow enters Airflow. -->
  <path class="cross" d="M1577 252 V292 H845 V365"/>
  <text class="label" x="1110" y="285" text-anchor="middle">Reads archived data</text>

  <!-- FastAPI queries the speed tables. Route around the outer edge to avoid every data-flow line. -->
  <path class="cross" d="M850 825 V878 H1760 V35 H1210 V52"/>
  <text class="label" x="1500" y="57" text-anchor="middle">Live state queries</text>

  <!-- FastAPI queries daily batch results; the arrow enters PostgreSQL from below. -->
  <path class="cross" d="M900 690 V575 H1575 V520"/>
  <text class="label" x="1365" y="570" text-anchor="middle">Daily report queries</text>
</svg>
